<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WAD Tunes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}" />
    <script src="{{ url_for('static', filename='scripts/script.js') }}" defer></script>
</head>

<svg width=" 0" height="0" style="position:absolute">
    <defs>
        <linearGradient id="starGradient" x1="0" x2="1" y1="0" y2="0">
            <stop offset="var(--fill,0)" stop-color="var(--theme-accent)" />
            <stop offset="var(--fill,0)" stop-color="var(--item-bg)" />
        </linearGradient>
    </defs>
</svg>

<body>
    <div class="header">
        <nav class="header-links">
            <ul>
                <li><a class="nav-link active" href="#">Current Album</a></li>
                <li><a class="nav-link" href=".all_albums.html">All Albums</a></li>
            </ul>
        </nav>

        <div class="header-title">WAD Tunes</div>


        <div class="login-container">
            <div class="users-container">
                <button class="nav-button login-button" id="login-button" type="button" aria-label="User">LOGIN</button>
                <div class="login-dropdown-menu" id="dropdownMenu">
                    <div class="new-user" id="newUserOption">
                        NEW USER
                    </div>
                    <ul class="user-list" id="userList" data-users="{{ users | tojson | safe }}">
                        {% for user in users %}
                        <li class="user-item" data-username="{{ user.username }}">{{user.username}}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>


    {% block content %}

    {% endblock %}


</body>

</html>
